[package]
name = "cythan-v4"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lir = { path = "crates/lir" }
mir = { path = "crates/mir" }
cythan = { path = "crates/vm" }
cythan-driver = { path = "crates/driver" }
typer = { path = "crates/typer" }
hir = { path = "crates/hir" }
errors = { path = "crates/errors" }
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = true

[workspace]
members = ["crates/lir", "crates/vm", "crates/mir", "crates/errors", "crates/driver", "crates/new_parser", "crates/typer", "crates/hir", "crates/lsp"]

[workspace.lints.clippy]
# Error type from ariadne is inherently large (192 bytes); boxing it would require
# changing every Result<T, Error> across the codebase for minimal benefit.
result_large_err = "allow"
large_enum_variant = "allow"

[lints]
workspace = true
