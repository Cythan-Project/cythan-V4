[package]
name = "cythan-lsp"
version = "0.1.0"
edition = "2018"

[[bin]]
name = "cythan-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cythan-driver = { path = "../driver" }
typer = { path = "../typer" }
new-parser = { path = "../new_parser" }
errors = { path = "../errors" }
